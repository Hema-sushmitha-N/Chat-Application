name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Switch to `npm ci` (and add npm caching) once package-lock.json is committed
      - run: npm install
      - run: npm test

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Switch to `npm ci` (and add npm caching) once package-lock.json is committed
      - run: npm install
      - run: npm run build
